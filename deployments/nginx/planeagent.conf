# PlaneAgent Nginx Configuration
# This configuration serves the React frontend and proxies API requests to Django
# Solves cross-origin cookie issues by making frontend and API same-origin

server {
    listen 80;
    server_name _;  # Accept any server name

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Logging
    access_log /var/log/nginx/plane-access.log;
    error_log /var/log/nginx/plane-error.log;

    # =============================================================================
    # API Proxy - Routes all /api/ requests to Django backend
    # This makes the API same-origin with the frontend, fixing cookie issues
    # =============================================================================
    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # Cookie handling - ensure cookies are passed through
        proxy_pass_header Set-Cookie;
        proxy_set_header Cookie $http_cookie;
        
        # Timeout settings
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # =============================================================================
    # Authentication endpoints - Also proxy to Django
    # =============================================================================
    location /auth/ {
        proxy_pass http://127.0.0.1:8000/auth/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass_header Set-Cookie;
        proxy_set_header Cookie $http_cookie;
    }

    # =============================================================================
    # Admin/God Mode - Proxy to admin interface
    # =============================================================================
    location /god-mode/ {
        proxy_pass http://127.0.0.1:8000/god-mode/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass_header Set-Cookie;
        proxy_set_header Cookie $http_cookie;
    }

    # =============================================================================
    # Static files - Serve directly from nginx
    # =============================================================================
    location /static/ {
        alias /opt/planeagent/apps/api/static-assets/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # =============================================================================
    # Media files - Serve directly from nginx
    # =============================================================================
    location /media/ {
        alias /opt/planeagent/mediafiles/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # =============================================================================
    # React Frontend - Serve the built files
    # =============================================================================
    location / {
        root /opt/planeagent/apps/web/dist;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
        
        # Cache static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }

    # Error pages
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}